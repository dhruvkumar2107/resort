<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CTJQYWHSQJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CTJQYWHSQJ');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Password | Akshaya Milan Admin</title>
  <link rel="icon" href="/assets/images/brand/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/assets/images/brand/logo-emblem.png" alt="Akshaya Milan" />
        <h1>Reset Password</h1>
      </div>
      <p class="lead">Enter your administrator email and we'll send you a secure recovery link.</p>
      <form id="reset-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <button class="btn btn-dark" type="submit" id="submit-btn">Send Recovery Link</button>
      </form>
      <div class="auth-status" id="auth-status" role="alert"></div>
      <div class="auth-alt"><a href="/admin/login">Back to sign in</a></div>
    </div>
  </div>
  <script>
    (function () {
      var form = document.getElementById("reset-form");
      var status = document.getElementById("auth-status");
      var btn = document.getElementById("submit-btn");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        status.textContent = ""; status.className = "auth-status";
        var email = document.getElementById("email").value.trim();
        if (!email) { status.textContent = "Please enter your email."; status.className = "auth-status err"; return; }
        btn.disabled = true; btn.textContent = "Sending…";
        fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            status.textContent = d.message || "If that account exists, you will receive an email shortly.";
            status.className = "auth-status ok";
          })
          .catch(function () {
            status.textContent = "Could not reach the server. Please retry.";
            status.className = "auth-status err";
          })
          .finally(function () { btn.disabled = false; btn.textContent = "Send Recovery Link"; });
      });
    })();
  </script>
</body>
</html>
